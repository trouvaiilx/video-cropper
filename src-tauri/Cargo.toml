[package]
name = "video-cropper"
version = "0.2.0"
description = "Minimalist desktop video cropping utility (Rust + Tauri + FFmpeg)"
authors = ["Video Cropper"]
edition = "2021"

[lib]
name = "video_cropper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
which = "7"
rfd = "0.15"
base64 = "0.22"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
