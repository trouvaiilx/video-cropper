[project]
name = "video-cropper"
version = "0.1.0"
description = "Minimalist desktop video cropping utility (PySide6 + FFmpeg)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Video Cropper" }]
dependencies = [
  "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4",
]

[project.scripts]
video-cropper = "video_cropper.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
